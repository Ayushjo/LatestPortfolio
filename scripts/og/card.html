<!-- Case studies: ?card=work&slug=<slug> → public/og-work-<slug>-v1.png (reads dist/work/cards.json,
     so build first).
     Numbers on the cards are ones that don't drift (no PR or contribution counts), so the
     images never go stale between renders.
     Share cards: ?card=home → public/og-v3.png, ?card=resume → public/og-resume-v2.png.
     Render both: sh scripts/og/render.sh -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Inter Tight';font-weight:400;src:url(../../node_modules/@fontsource/inter-tight/files/inter-tight-latin-400-normal.woff2)}
  @font-face{font-family:'Inter Tight';font-weight:500;src:url(../../node_modules/@fontsource/inter-tight/files/inter-tight-latin-500-normal.woff2)}
  @font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;src:url(../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2)}
  @font-face{font-family:'JetBrains Mono';font-weight:400;src:url(../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2)}
  @font-face{font-family:'JetBrains Mono';font-weight:500;src:url(../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2)}
  html,body{margin:0;background:#050506}
  #card{position:relative;width:1200px;height:630px;overflow:hidden;background:#050506;color:#f2f3f5}
  canvas{position:absolute;inset:0}
  .t{position:absolute;white-space:nowrap}
  .serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.01em}
  .mono{font-family:'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
  .sans{font-family:'Inter Tight',sans-serif}
  .dim{color:#8b8e96}.faint{color:#5d6068}
  .rule{position:absolute;height:1px;background:#2a2c31}
</style></head>
<body><div id="card"><canvas id="c" width="2400" height="1260" style="width:1200px;height:630px"></canvas></div>
<script>
const W=1200,H=630,S=2;
const v=new URLSearchParams(location.search).get('card')||'home';
const card=document.getElementById('card'), cv=document.getElementById('c'), g=cv.getContext('2d');
g.scale(S,S);
const rnd=(a,b)=>a+Math.random()*(b-a);
const html=(s)=>card.insertAdjacentHTML('beforeend',s);

// --- ink sources -------------------------------------------------------
function maskCanvas(){const c=document.createElement('canvas');c.width=W;c.height=H;return [c,c.getContext('2d',{willReadFrequently:true})];}
async function img(src){const i=new Image();i.src=src;await new Promise(r=>i.onload=r);return i;}
/** Samples points with probability ∝ luminance inside a drawn mask. */
function sample(ctx,n,gamma=1){const d=ctx.getImageData(0,0,W,H).data;const pts=[];let tries=0;
  while(pts.length<n&&tries<n*60){tries++;const x=Math.random()*W|0,y=Math.random()*H|0;const l=d[(y*W+x)*4]/255;
    if(l>0.04&&Math.random()<Math.pow(l,gamma))pts.push([x+Math.random(),y+Math.random(),l]);}return pts;}

// --- particles + glow ----------------------------------------------------
const layer=document.createElement('canvas');layer.width=W*S;layer.height=H*S;const L=layer.getContext('2d');L.scale(S,S);
function dots(pts,{r=[0.5,1.2],a=[0.35,0.95],lumW=0.6}={}){for(const [x,y,l] of pts){const al=rnd(a[0],a[1])*(1-lumW+lumW*l);const rr=rnd(r[0],r[1]);
  L.fillStyle=`rgba(${236*al|0},${242*al|0},${255*al|0},${al})`;L.beginPath();L.arc(x,y,rr,0,7);L.fill();}}
function stream({y0=315,spread=360,n=5000,amp=26,alpha=[0.05,0.26]}={}){for(let i=0;i<n;i++){const lane=(i%36)/36;const x=Math.random()*W;
  const y=y0+(lane-0.5)*spread+Math.sin(x*0.006+lane*9)*amp+rnd(-3,3);const al=rnd(alpha[0],alpha[1]);
  L.fillStyle=`rgba(${230*al|0},${235*al|0},${255*al|0},${al})`;L.fillRect(x,y,rnd(2,9),0.9);}}
function composite(glow=9){g.fillStyle='#050506';g.fillRect(0,0,W,H);
  g.save();g.filter=`blur(${glow}px)`;g.globalAlpha=0.9;g.drawImage(layer,0,0,W,H);g.restore();
  g.globalCompositeOperation='screen';g.drawImage(layer,0,0,W,H);g.globalCompositeOperation='source-over';
  // grain
  const n=g.getImageData(0,0,W*S,H*S);const d=n.data;for(let i=0;i<d.length;i+=4){const k=(Math.random()-0.5)*7;d[i]+=k;d[i+1]+=k;d[i+2]+=k;}g.putImageData(n,0,0);}
function vignette(){const r=g.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,W*0.75);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,0.55)');g.fillStyle=r;g.fillRect(0,0,W,H);}

async function textMask(text,{font,x,y,align='center'}){const [c,ctx]=maskCanvas();await document.fonts.load(font);ctx.fillStyle='#fff';ctx.font=font;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(text,x,y);return ctx;}
async function imageMask(src,{x,y,h}){const [c,ctx]=maskCanvas();const i=await img(src);const w=i.width*h/i.height;ctx.drawImage(i,x,y,w,h);return ctx;}

const variants={
  // Home: portrait in silver particles, editorial type on the left.
  async home(){const m=await imageMask('../../public/portrait/ayush-bust-matte.png',{x:640,y:20,h:610});dots(sample(m,90000,1.1),{r:[0.45,1.1]});stream({y0:520,spread:180,n:2600,alpha:[0.03,0.16]});composite(7);vignette();
    html(`<div class="t mono dim" style="left:72px;top:150px;font-size:15px">Systems engineer · Naya Raipur</div>
      <div class="t serif" style="left:68px;top:178px;font-size:112px;line-height:.95">Ayush<br>Singh</div>
      <div class="t sans dim" style="left:72px;top:420px;font-size:25px;line-height:1.35">Storage engines, proxies, agents —<br>the parts of software nobody sees.</div>
      <div class="t mono" style="left:72px;top:536px;font-size:16px;color:#d9dbe0">www.iayush.com</div>`);},

  // Résumé: paper and ink. The portrait is an ink halftone; the type is the résumé's own.
  async resume(){
    const PAPER='#f3f1ea', INK='17,17,19';
    card.style.background=PAPER; card.style.color='#141416';
    g.fillStyle=PAPER; g.fillRect(0,0,W,H);
    // The site's silver-particle portrait, as a dark print mounted on the page.
    const P={x:716,y:56,w:412,h:518,r:20};
    const m=await imageMask('../../public/portrait/ayush-bust-matte.png',{x:P.x-60,y:P.y+P.h-470,h:470});
    dots(sample(m,52000,1.1),{r:[0.4,0.95]});
    g.save(); g.shadowColor='rgba(20,18,12,0.28)'; g.shadowBlur=36; g.shadowOffsetY=16;
    g.beginPath(); g.roundRect(P.x,P.y,P.w,P.h,P.r); g.fillStyle='#0a0a0c'; g.fill(); g.restore();
    g.save(); g.beginPath(); g.roundRect(P.x,P.y,P.w,P.h,P.r); g.clip();
    g.filter='blur(6px)'; g.globalAlpha=0.85; g.drawImage(layer,0,0,W,H); g.filter='none'; g.globalAlpha=1;
    g.globalCompositeOperation='screen'; g.drawImage(layer,0,0,W,H); g.globalCompositeOperation='source-over';
    const vg=g.createRadialGradient(P.x+P.w/2,P.y+P.h*0.45,P.h*0.25,P.x+P.w/2,P.y+P.h/2,P.h*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.6)'); g.fillStyle=vg; g.fillRect(P.x,P.y,P.w,P.h);
    g.restore();
    g.strokeStyle='rgba(255,255,255,0.08)'; g.lineWidth=1; g.beginPath(); g.roundRect(P.x+0.5,P.y+0.5,P.w-1,P.h-1,P.r); g.stroke();
    html(`<div class="t mono" style="left:${P.x+22}px;top:${P.y+P.h-38}px;font-size:11px;color:#8b8e96">Naya Raipur · IST</div>`);
    html(`<div class="t mono" style="left:72px;top:74px;font-size:14px;color:#6b6a66">Résumé &nbsp;·&nbsp; 2026</div>
      <div class="t serif" style="left:68px;top:104px;font-size:104px;line-height:1">Ayush Singh</div>
      <div class="t sans" style="left:72px;top:232px;font-size:28px;font-weight:500">Backend &amp; systems engineer</div>
      <div class="t mono" style="left:72px;top:278px;font-size:14px;color:#6b6a66">TypeScript · Node.js · Rust · Python</div>
      <div style="position:absolute;left:72px;width:560px;top:336px;height:1px;background:#d8d5cb"></div>
      <div class="t serif" style="left:72px;top:356px;font-size:52px">36k+</div>
      <div class="t mono" style="left:74px;top:420px;font-size:11.5px;color:#6b6a66;line-height:1.5">users on a platform<br>I built and run</div>
      <div class="t serif" style="left:262px;top:356px;font-size:52px">~70k</div>
      <div class="t mono" style="left:264px;top:420px;font-size:11.5px;color:#6b6a66;line-height:1.5">req/s from my Rust<br>proxy, ~1% off nginx</div>
      <div class="t serif" style="left:462px;top:356px;font-size:52px">1.87M</div>
      <div class="t mono" style="left:464px;top:420px;font-size:11.5px;color:#6b6a66;line-height:1.5">writes/s from my<br>storage engine</div>
      <div style="position:absolute;left:72px;width:560px;top:478px;height:1px;background:#d8d5cb"></div>
      <div class="t sans" style="left:72px;top:500px;font-size:19px;color:#3a3a3d"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#3f9a5a;margin-right:10px;vertical-align:1px"></span>Open to internships &amp; full-time · Remote · Available now</div>
      <div class="t mono" style="left:72px;top:546px;font-size:15px;color:#141416">iayush.com/resume</div>`);
  },

  // Case study: paper, the project's name and numbers, and its demo still mounted on the right.
  async work(){
    const slug=new URLSearchParams(location.search).get('slug');
    const cards=await (await fetch('../../dist/work/cards.json')).json();
    const c=cards.find(x=>x.slug===slug);
    const PAPER='#f3f1ea';
    card.style.background=PAPER; card.style.color='#141416';
    g.fillStyle=PAPER; g.fillRect(0,0,W,H);
    const P={x:648,y:150,w:500,h:312,r:18};
    g.save(); g.shadowColor='rgba(20,18,12,0.3)'; g.shadowBlur=40; g.shadowOffsetY=18;
    g.beginPath(); g.roundRect(P.x,P.y,P.w,P.h,P.r); g.fillStyle='#0a0a0c'; g.fill(); g.restore();
    if (c.thumb) {
      const i=await img('../../public'+c.thumb);
      g.save(); g.beginPath(); g.roundRect(P.x,P.y,P.w,P.h,P.r); g.clip();
      const s2=Math.max(P.w/i.width,P.h/i.height); const w2=i.width*s2, h2=i.height*s2;
      g.drawImage(i,P.x+(P.w-w2)/2,P.y+(P.h-h2)/2,w2,h2); g.restore();
    } else {
      // No demo yet: the project's lead number in silver particles, as a print mounted on the page.
      const big=c.stats[0].value, fs=big.length>4?132:168;
      const m=await textMask(big,{font:`italic ${fs}px "Instrument Serif"`,x:P.x+P.w/2,y:P.y+P.h/2+fs*0.32});
      dots(sample(m,26000,1),{r:[0.45,1.05]});
      stream({y0:P.y+P.h*0.78,spread:70,n:1400,alpha:[0.04,0.18]});
      g.save(); g.beginPath(); g.roundRect(P.x,P.y,P.w,P.h,P.r); g.clip();
      g.filter='blur(6px)'; g.globalAlpha=0.85; g.drawImage(layer,0,0,W,H); g.filter='none'; g.globalAlpha=1;
      g.globalCompositeOperation='screen'; g.drawImage(layer,0,0,W,H); g.globalCompositeOperation='source-over';
      const vg=g.createRadialGradient(P.x+P.w/2,P.y+P.h/2,P.h*0.2,P.x+P.w/2,P.y+P.h/2,P.w*0.62);
      vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)'); g.fillStyle=vg; g.fillRect(P.x,P.y,P.w,P.h);
      g.restore();
      html(`<div class="t mono" style="left:${P.x+22}px;top:${P.y+P.h-38}px;font-size:11px;color:#8b8e96">${c.stats[0].label}</div>`);
    }
    g.strokeStyle='rgba(0,0,0,0.12)'; g.lineWidth=1; g.beginPath(); g.roundRect(P.x+0.5,P.y+0.5,P.w-1,P.h-1,P.r); g.stroke();
    const pad=(n)=>String(n).padStart(2,'0');
    const size=c.name.length>11?84:c.name.length>8?96:110;
    const stats=c.stats.map((s,k)=>`<div class="t serif" style="left:${72+k*178}px;top:394px;font-size:40px">${s.value}</div>
      <div class="t mono" style="left:${74+k*178}px;top:444px;width:160px;white-space:normal;font-size:10.5px;color:#6b6a66;line-height:1.5">${s.label}</div>`).join('');
    html(`<div class="t mono" style="left:72px;top:74px;font-size:14px;color:#6b6a66">Case study &nbsp;·&nbsp; ${pad(c.index)} / ${pad(c.total)}</div>
      <div class="t serif" style="left:68px;top:104px;font-size:${size}px;line-height:1">${c.name}</div>
      <div class="t sans" style="left:72px;top:${104+size+18}px;width:540px;white-space:normal;font-size:24px;font-weight:500;line-height:1.3">${c.tagline}</div>
      <div style="position:absolute;left:72px;width:530px;top:376px;height:1px;background:#d8d5cb"></div>
      ${stats}
      <div class="t mono" style="left:72px;top:540px;font-size:15px;color:#141416">iayush.com/work/${c.slug}</div>
      <div class="t mono" style="left:${P.x}px;top:${P.y+P.h+22}px;font-size:11px;color:#6b6a66">Ayush Singh${c.thumb?' · from the demo':' · in particles'}</div>`);
  },
};
(async()=>{
  // Every face is loaded before anything is drawn, so no line can render in a fallback or not at all.
  await Promise.all(['400 16px "Inter Tight"','500 16px "Inter Tight"','italic 400 16px "Instrument Serif"','400 16px "JetBrains Mono"','500 16px "JetBrains Mono"'].map(f=>document.fonts.load(f)));
  await variants[v]();await document.fonts.ready;document.title='ready';})();
</script></body></html>
